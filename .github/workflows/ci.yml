name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          SECRET_KEY: "test_secret_key_32_bytes_super_secure_key"
          ENCRYPTION_KEY: "e2N3RXZnN3I0SmtjVUp4b2p4VlhXWGpnVlp4cE5TbzE="
          LLM_PROVIDER: "mock"
        run: |
          cd backend
          pytest -v

  frontend-build:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests & Coverage Gate
        run: |
          cd frontend
          npm run test:coverage

      - name: Run Frontend Production Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          cd frontend
          npm run build
