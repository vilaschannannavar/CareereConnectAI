version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: careerconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerconnect_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-careerconnect_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerconnect} -d ${POSTGRES_DB:-careerconnect_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - careerconnect_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerconnect_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_NAME=CareerConnect AI
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-careerconnect_prod_secret_key_32_bytes_super_secure}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-e2N3RXZnN3I0SmtjVUp4b2p4VlhXWGpnVlp4cE5TbzE=}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-careerconnect}:${POSTGRES_PASSWORD:-careerconnect_dev_password}@postgres:5432/${POSTGRES_DB:-careerconnect_dev}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_PATH=/app/data/private_storage
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_USER_BUDGET_CAP_USD=${LLM_USER_BUDGET_CAP_USD:-1.00}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID:-}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET:-}
      - LINKEDIN_REDIRECT_URI=${LINKEDIN_REDIRECT_URI:-http://localhost:8000/api/v1/auth/linkedin/callback}
    ports:
      - "8000:8000"
    volumes:
      - private_storage:/app/data/private_storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - careerconnect_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerconnect_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    networks:
      - careerconnect_net

volumes:
  postgres_data:
    driver: local
  private_storage:
    driver: local

networks:
  careerconnect_net:
    driver: bridge
